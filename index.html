<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nuvai Studios</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
   <!-- Barra de Navegación Superior -->
    <nav class="top-nav">
        <div class="nav-left">
            <a href="#" class="logo"><img src="./images/logonuvaihd.png" alt=""></a>
            <a href="#">Explore ▾</a>
            <a href="#">Directory</a>
            <a href="#">Academy <span class="new-tag">NEW</span></a>
            <a href="#">Jobs</a>
            <a href="#">Market</a>
        </div>
        <div class="nav-right">
            <div class="search-box">Search by Inspiration</div>
            <a href="#">Log In</a>
            <a href="#">Sign Up</a>
            <a href="#" class="btn btn-be-pro">Be Pro</a>
            <a href="#" class="btn btn-submit">Submit Website</a>
        </div>
    </nav>

    <!-- Sección Principal -->
    <header class="main-content">
        <h1>AGENCIA DE MARKETING Y DISEÑO</h1>
    </header>

    <!-- Sección del Showcase (Nueva Captura) -->
    <section class="showcase-section">
        <div class="showcase-card">
            <div class="preview-frame">
                <div class="preview-screen">
                    <!-- Texto tipográfico de fondo -->
                    <div class="preview-text-bg">FS 60P</div>
                    <!-- Imagen central del reloj (puedes cambiar el src por tu propia imagen) -->
                    <img src="https://images.unsplash.com/photo-1523275335684-37898b6baf30?auto=format&fit=crop&w=300&q=80" alt="Reloj" class="preview-watch-img">

                    <!-- Detalles del modelo -->
                    <div class="preview-details">
                        <span>MODEL</span>
                        <h3>146GR</h3>
                    </div>
                </div>
            </div>

            <div class="highlights-text">
                See the highlights<br>of this website.
            </div>

            <!-- Barra de navegación flotante del proyecto -->
            <div class="project-nav-float">
                <div class="proj-btn proj-btn-w active">W.</div>
                <div class="proj-btn">Nominees</div>
                <div class="proj-btn">Courses</div>
                <div class="proj-btn">Collections</div>
                <div class="proj-btn">Directory</div>
                <div class="proj-btn">Market</div>
                <div class="proj-btn proj-btn-visit">Visit Sotd.</div>
            </div>
        </div>
    </section>
</body>

</html>
